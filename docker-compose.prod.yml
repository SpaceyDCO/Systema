services:
  # MariaDB
  mariadb:
    image: mariadb:11.2
    container_name: systema-mariadb # Container name
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Error - DB_ROOT_PASSWORD not set}
      MARIADB_DATABASE: ${DB_NAME:?Error - DB_NAME not set}
      MARIADB_USER: ${DB_USER:?Error - DB_USER not set}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Error - DB_PASSWORD not set}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./backend/docker/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    # Health check
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # Attach to custom network
    networks:
      - systema-network

  # Spring Boot
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile #Update to pre-built image
    container_name: systema-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?Error - SPRING_PROFILES_ACTIVE not set}
      DB_NAME: ${DB_NAME:?Error - DB_NAME not set}
      DB_USER: ${DB_USER:?Error - DB_USER not set}
      DB_PASS: ${DB_PASSWORD:?Error - DB_PASSWORD not set}
      JAVA_OPTS: ${JAVA_OPTS:-Xms512m -Xmx2g}
    ports:
      - "8080:8080"
    depends_on:
      mariadb:
        condition: service_healthy # Wait for MariaDB to be "Healthy"
    networks:
      - systema-network

# Data storage
volumes:
  # Stored in /var/lib/docker/volumes/
  mariadb-data:
    driver: local

# Networks
networks:
  systema-network:
    driver: bridge
